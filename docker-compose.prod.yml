services:
  postgres:
    image: postgres:17
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: aiteam
      POSTGRES_USER: aiteam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiteam"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  aiteam-bot:
    image: ghcr.io/darkleong/aiteam-bot:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    # Stage 65 子項 3：workspace named volume permission init（Trial_v10 揭：mount 後 named volume 預設 root-owned，appuser uid 999 寫不進 → 手動 chown 才跑下去）。
    # 路線 B compose entrypoint：以 root 啟動 → chown workspace → exec gosu 切回 appuser 跑 dotnet（每次 container start 都 init permission）。Dockerfile 已裝 gosu。
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - "chown -R appuser:appuser /tmp/aiteam-workspace && exec gosu appuser dotnet AiTeam.Bot.dll"
    environment:
      ConnectionStrings__AiTeamDb: "Host=postgres;Database=aiteam;Username=aiteam;Password=${POSTGRES_PASSWORD}"
      Discord__BotToken: "${DISCORD_BOT_TOKEN}"
      Discord__GuildId: "${DISCORD_GUILD_ID}"
      Discord__Channels__TaskUpdates: "任務動態"
      Discord__Channels__Alerts: "警報"
      Discord__Channels__DailySummary: "每日摘要"
      Discord__Channels__CeoChannel: "victoria-ceo"
      Discord__Channels__DevChannel: "cody-dev"
      Discord__Channels__OpsChannel: "maya-ops"
      Discord__Channels__QaChannel: "quinn-qa"
      Discord__Channels__DocChannel: "sage-doc"
      Discord__Channels__RequirementsChannel: "rosa-requirements"
      Discord__Channels__ReviewerChannel: "vera-reviewer"
      Discord__Channels__ReleaseChannel: "rena-release"
      Discord__Channels__DesignerChannel: "demi-designer"
      Anthropic__ApiKey: "${AITEAM_ANTHROPIC_KEY}"
      Gemini__ApiKey: "${AITEAM_GEMINI_KEY}"
      # Stage 63B Trial_v9 揭：v1 stable Gemini API 不支援 systemInstruction 欄位（400 BadRequest），改用 v1beta 對齊 Stage 63A spike 已驗 path
      Gemini__BaseUrl: "${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}"
      GitHub__PersonalAccessToken: "${GITHUB_PAT}"
      GitHub__Owner: "darkleong"
      GitHub__DefaultRepo: "AiTeam"
      GitHub__WorkspacePath: "/tmp/aiteam-workspace"
      GitHub__WebhookSecret: "${GITHUB_WEBHOOK_SECRET}"
      Dashboard__PushUrl: "http://aiteam-dashboard:8080"
      AgentSettings__RulesCacheTtlMinutes: "60"
      AgentSettings__DailyReportCron: "0 0 9,21 * * ?"
      AgentSettings__InternalApiKey: "${BOT_INTERNAL_API_KEY}"
      AgentSettings__SkipCeoConfirm: "false"
    volumes:
      # Stage 64：workspace 持久化（v5 PoC Trial_v9 揭 #5 — Bot recreate workspace 蒸發手動 git clone 缺口）。compose 自動建 named volume 不走 external，self-hosted runner 部署無摩擦。既有 ephemeral 內容遺失（Trial_v9 已驗無 production 數據）。
      - aiteam-workspace-data:/tmp/aiteam-workspace
    ports:
      - "5052:8080"

  aiteam-dashboard:
    image: ghcr.io/darkleong/aiteam-dashboard:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5051:8080"   # Stage 22：只綁定 localhost，外部裝置無法直連
    environment:
      ConnectionStrings__AiTeamDb: "Host=postgres;Database=aiteam;Username=aiteam;Password=${POSTGRES_PASSWORD}"
      Dashboard__AdminEmail: "${DASHBOARD_ADMIN_EMAIL}"
      Dashboard__AdminPassword: "${DASHBOARD_ADMIN_PASSWORD}"
      Dashboard__HubBaseUrl: "http://localhost:8080"
      Bot__InternalUrl: "http://aiteam-bot:8080"
      Bot__InternalApiKey: "${BOT_INTERNAL_API_KEY}"
      ASPNETCORE_HTTP_PORTS: "8080"
      LocalhostBypass__TrustedIPs__0: "172.19.0.1"

volumes:
  postgres_data:
    name: aiteam-postgres-data
    external: true
  aiteam-workspace-data:
    # Stage 64：compose 自動建（不走 external — workspace 是 git clone 可重建 ephemeral，不需 external 護身符 vs postgres 真實資料）
    name: aiteam-workspace-data
