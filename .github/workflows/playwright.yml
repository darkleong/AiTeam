name: Playwright Visual Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.razor'
      - '**/*.css'
      - 'src/AiTeam.Tests.Playwright/**'

jobs:
  playwright-test:
    name: Playwright UI Tests
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write   # 允許在 PR 留 comment

    steps:
      - uses: actions/checkout@v4

      - name: Check Dashboard is running
        id: health
        shell: pwsh
        run: |
          $status = try { (Invoke-WebRequest -Uri http://localhost:5051 -UseBasicParsing -TimeoutSec 5).StatusCode } catch { 0 }
          if ($status -eq 200 -or $status -eq 302) {
            echo "dashboard_up=true" >> $env:GITHUB_OUTPUT
            Write-Host "Dashboard is up (HTTP $status)"
          } else {
            Write-Host "::warning::Dashboard is not running (HTTP $status), skipping Playwright tests"
            echo "dashboard_up=false" >> $env:GITHUB_OUTPUT
          }

      - name: Restore Playwright project
        if: steps.health.outputs.dashboard_up == 'true'
        shell: pwsh
        run: dotnet restore src/AiTeam.Tests.Playwright/AiTeam.Tests.Playwright.csproj

      - name: Build Playwright project
        if: steps.health.outputs.dashboard_up == 'true'
        shell: pwsh
        run: dotnet build src/AiTeam.Tests.Playwright/AiTeam.Tests.Playwright.csproj --no-restore -c Release

      - name: Install Playwright browsers
        if: steps.health.outputs.dashboard_up == 'true'
        shell: pwsh
        run: pwsh src/AiTeam.Tests.Playwright/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: Run Playwright tests
        if: steps.health.outputs.dashboard_up == 'true'
        shell: pwsh
        env:
          DASHBOARD_URL: http://localhost:5051
          DASHBOARD_USER: ${{ secrets.DASHBOARD_TEST_USER }}
          DASHBOARD_PASS: ${{ secrets.DASHBOARD_TEST_PASS }}
        run: |
          dotnet test src/AiTeam.Tests.Playwright/AiTeam.Tests.Playwright.csproj `
            --no-build -c Release `
            --logger "trx;LogFileName=results.trx"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ github.run_number }}
          path: src/AiTeam.Tests.Playwright/screenshots/
          if-no-files-found: ignore

      - name: Post screenshots to PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const screenshotDir = 'src/AiTeam.Tests.Playwright/screenshots';
            if (!fs.existsSync(screenshotDir)) { console.log('No screenshots'); return; }
            const files = fs.readdirSync(screenshotDir).filter(f => f.endsWith('.png')).slice(0, 10);
            if (files.length === 0) { console.log('No PNG files'); return; }
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            let body = `## 📸 Playwright 視覺截圖測試結果\n\n`;
            body += `**狀態**：${{ job.status == 'success' && '✅ 全部通過' || '❌ 有測試失敗' }}\n\n`;
            body += `完整截圖：[下載 Artifacts](${runUrl})\n\n`;
            body += `| 截圖 |\n|------|\n`;
            files.forEach(f => { body += `| \`${f}\` |\n`; });
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
